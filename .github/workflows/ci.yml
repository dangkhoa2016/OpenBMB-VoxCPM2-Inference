name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run bootstrap tests
        run: python -m pytest -q
      - name: Verify version
        run: test "$(tr -d '\r\n' < VERSION)" = "1.0.0"
      - name: Reject tracked model weights
        shell: bash
        run: |
          BAD_TRACKED="$(git ls-files | grep -Ei '\.(safetensors|ckpt|pth|pt|bin|gguf|onnx|onnx_data|npz|npy|h5|pb)$' || true)"
          if [ -n "$BAD_TRACKED" ]; then
            echo "Model or binary weight files are tracked:"
            echo "$BAD_TRACKED"
            exit 1
          fi
      - name: Verify side-effect-free import
        run: python -c "import voxcpm_runtime; assert voxcpm_runtime.__version__ == '1.0.0'"
