name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run bootstrap tests
        run: python -m pytest -q
      - name: Compile M2 modules
        run: python -m compileall -q voxcpm_runtime deploy tests scripts
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify model CLI structured failure without a model
        shell: bash
        run: |
          set +e
          VOXCPM_OFFLINE=1 voxcpm-verify-model > /tmp/voxcpm-verify-model.json 2> /tmp/voxcpm-verify-model.err
          rc=$?
          set -e
          test "$rc" -ne 0
          test ! -s /tmp/voxcpm-verify-model.err
          python -m json.tool /tmp/voxcpm-verify-model.json >/dev/null
      - name: Run doctor default smoke
        shell: bash
        run: |
          voxcpm-doctor > /tmp/voxcpm-doctor-default.json
          python -m json.tool /tmp/voxcpm-doctor-default.json >/dev/null
      - name: Run doctor explicit CPU smoke
        shell: bash
        run: |
          VOXCPM_DEVICE=cpu voxcpm-doctor > /tmp/voxcpm-doctor-cpu.json
          python -m json.tool /tmp/voxcpm-doctor-cpu.json >/dev/null
      - name: Verify explicit CUDA has no CPU fallback
        shell: bash
        run: |
          set +e
          VOXCPM_DEVICE=cuda voxcpm-doctor > /tmp/voxcpm-doctor-cuda.json 2> /tmp/voxcpm-doctor-cuda.err
          rc=$?
          set -e
          test "$rc" -ne 0
          test -s /tmp/voxcpm-doctor-cuda.err
      - name: Verify invalid configuration fails
        shell: bash
        run: |
          set +e
          VOXCPM_DEVICE=banana voxcpm-doctor > /tmp/voxcpm-doctor-invalid.json 2> /tmp/voxcpm-doctor-invalid.err
          rc_device=$?
          VOXCPM_GPU_DEVICES='0,,1' voxcpm-doctor > /tmp/voxcpm-doctor-gpu-invalid.json 2> /tmp/voxcpm-doctor-gpu-invalid.err
          rc_gpu=$?
          set -e
          test "$rc_device" -ne 0
          test "$rc_gpu" -ne 0
      - name: Verify doctor secret redaction
        shell: bash
        run: |
          DUMMY='m1-ci-redaction-placeholder'
          VOXCPM_API_TOKEN="$DUMMY" voxcpm-doctor > /tmp/voxcpm-doctor-redaction.json 2> /tmp/voxcpm-doctor-redaction.err
          if grep -F "$DUMMY" /tmp/voxcpm-doctor-redaction.json /tmp/voxcpm-doctor-redaction.err; then
            echo "secret value leaked into doctor output"
            exit 1
          fi
      - name: Verify version
        run: test "$(tr -d '\r\n' < VERSION)" = "1.0.0"
      - name: Reject tracked model weights
        shell: bash
        run: |
          BAD_TRACKED="$(git ls-files | grep -Ei '\.(safetensors|ckpt|pth|pt|bin|gguf|onnx|onnx_data|npz|npy|h5|pb)$' || true)"
          if [ -n "$BAD_TRACKED" ]; then
            echo "Model or binary weight files are tracked:"
            echo "$BAD_TRACKED"
            exit 1
          fi
      - name: Verify side-effect-free import
        run: python -c "import voxcpm_runtime; assert voxcpm_runtime.__version__ == '1.0.0'"
